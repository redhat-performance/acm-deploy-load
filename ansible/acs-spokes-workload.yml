---
# Playbook to deploy workload pods on ACM managed spoke clusters
#
# This playbook reads container image names from a file, determines the number of worker
# nodes in each spoke cluster, and deploys a workload with matching replicas and pod
# anti-affinity to distribute pods across worker nodes.
#
# Example Usage:
#
# time ansible-playbook -i ansible/inventory/cloud30.local ansible/acs-spokes-workload.yml \
#   -e container_images_file=./workload_images.txt
#
# time ansible-playbook -i ansible/inventory/cloud30.local ansible/acs-spokes-workload.yml \
#   -e container_images_file=./workload_images.txt \
#   -e workload_namespace=my-workload \
#   -e container_image_registry_host=registry.example.com \
#   -e container_image_tag=v1.0.0
#
# The tag is used only to look up the image manifest digest. The workload is
# deployed with an immutable repository@sha256:... image reference.

- name: Deploy workload to ACM managed spoke clusters
  hosts: bastion
  connection: local
  gather_facts: true

  vars_files:
    - vars/all.yml

  vars:
    container_image_registry_host: "{{ inventory_hostname }}"
    container_image_registry_port: "5000"
    container_registry_namespace: "operator-containers"
    container_image_tag: "acs-testing"

  roles:
    - role: acs-spokes-deploy-load
