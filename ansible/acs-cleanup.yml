---
# Cleanup ACS sensors, registrations, and optionally RHACS Central resources.
# Role tags select individual cleanup phases:
#   sensor-cleanup  - delete sensors from managed clusters
#   registration    - unregister managed clusters from Central
#   central-cleanup - revoke admin-crs and remove Central resources
# Run without --tags to perform the complete cleanup in this order.
- name: Cleanup ACS resources
  hosts: bastion
  connection: local
  gather_facts: true

  vars_files:
    - vars/all.yml

  vars:
    rox_api_token: "{{ lookup('env', 'ROX_API_TOKEN') }}"
    rox_central_address: "{{ lookup('env', 'ROX_CENTRAL_ADDRESS') }}"

  roles:
    - role: acs-spokes-sensor-cleanup
      tags: [sensor-cleanup]
    - role: acs-spokes-registration
      vars:
        acs_spokes_registration_action: unregister
      tags: [registration]
    - role: rhacm-acs-central-cleanup
      tags: [central-cleanup]
