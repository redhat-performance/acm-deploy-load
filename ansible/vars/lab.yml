# Lab hardware reference data (You should not have to edit this file)
# Mirrors jetlag's ansible/vars/lab.yml hw_nic_name structure.

# hw_nic_name maps each hardware model to its ordered NIC list.
# Index [0] is the public lab DHCP interface — this is what must be disabled
# on bare metal spoke nodes/clusters/environments.
# Set ocloud_lab_dhcp_interface: "{{ hw_nic_name[lab][hw_model][0] }}" in all.yml,
# or look up the correct name here and set it directly.
#
#   lab:
#     hw_model:
#     - (nic 0 - public lab DHCP NIC)
#     - (nic 1 - provisioning/controlplane NIC)
#     - (nic 2+  - additional NICs)
