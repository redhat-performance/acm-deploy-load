---
# O-Cloud cluster definitions for ocloud-manifests.yml
#
# Each entry generates one cluster's ProvisioningRequest and inventory (BMH + secrets).
# Profile controls topology and install type:
#   std-ran-du:   3 masters + N workers (AI only)
#   3node-ran-du: 3 schedulable masters (AI only)
#   sno-ran-du:   1 master/SNO (AI and IBI)
#
# Optional 'count: N' repeats a definition N times (default 1).
# Optional 'labels: {}' adds extra ManagedCluster labels.
#
# VMs are carved sequentially from hv_vm inventory group.
# Apply inventory (ocloud/inventory/*.yaml) before ProvisioningRequests.

ocloud_cluster_definitions:
- profile: std-ran-du
  workers: 3
  labels: {}

# 3-node compact cluster example:
