---
# Playbook to create manifests for O-Cloud cluster(s)
#
# Generates ProvisioningRequest and O-Cloud inventory (BMH + NMState + BMC secrets)
# for one or more clusters defined in ocloud_cluster_definitions. Supports all
# topologies: sno-ran-du (1 master), 3node-ran-du (3 schedulable masters),
# std-ran-du (3 masters + N workers).
#
# Two mutually exclusive inventory sources:
#
# Bare Metal: set ocp_inventory in vars/ocloud.yml to a local path or quads URL.
#   Nodes are carved from the ocp_inventory JSON after auto-excluding the bastion
#   and hub controlplane machines. Set ocloud_bm_* network vars accordingly.
#   Set quads_api_token when downloading from a QUADS 3+ server.
#
# Virtual Machine: omit ocp_inventory (or leave it None) and run with a jetlag
#   inventory that has a populated hv_vm group. Nodes are carved from that group.
#
# Example Usage:
#
# time ansible-playbook -i ansible/inventory/cloud30.local ansible/ocloud-manifests.yml
#

- name: Create manifests to create O-Cloud cluster(s)
  hosts: bastion
  gather_facts: false
  vars_files:
  - vars/all.yml
  - vars/ocloud.yml
  vars:
    ocloud_clusters: []
  roles:
  - role: ocloud-bm-inventory
    when: ocp_inventory is defined and ocp_inventory is not none
  - role: ocloud-vm-inventory
    when: '"hv_vm" in groups and (ocp_inventory is not defined or ocp_inventory is none)'
  - role: ocloud-create-manifests
    when: ocloud_clusters | length > 0
