---
# ibi-create-prep-iso default vars

# Version of the seed image we are using for this ibi iso file
seed_image_version: 4.22.0

# Allow the seed image tag to be overriden (Ex bm-4.22.0)
seed_image_tag: "{{ seed_image_version }}"

# Possible HTTP store paths (checked in order, defaults to first if neither exists)
http_store_paths:
- /opt/jetlag/http_store
- /opt/http_store

# Possible registry certificate paths (checked in order)
registry_cert_paths:
- /opt/jetlag/registry/certs/domain.crt
- /opt/registry/certs/domain.crt

# SSH Key to access machine that has booted IBI Prep ISO
ssh_public_key_file: ~/.ssh/id_rsa.pub

# ISO filename without .iso extension — set by the caller to identify this node's ISO
ibi_iso_name: rhcos-ibi-prep

# Node-specific vars — set by the caller for each node being prepared
ibi_iso_node_mac: ""
ibi_iso_node_ip: ""
ibi_iso_node_prefix: 64
ibi_iso_node_gateway: ""
ibi_iso_node_dns: ""
ibi_iso_node_nic: enp1s0
ibi_iso_node_install_disk: /dev/sda

# Allow overriding the ignition config overrides to the preparation ISO
# Default disables containers policy.json and prevents lab dhcp from interfering with static network setup
ibi_prep_iso_ignitionConfigOverride: '{"ignition": {"version":"3.2.0"},"storage": {"files": [{"path": "/etc/NetworkManager/conf.d/99-no-auto-default.conf", "mode": 420, "overwrite": true, "contents": {"source": "data:text/plain;charset=utf-8;base64,W21haW5dCm5vLWF1dG8tZGVmYXVsdD0qCg=="}},{"path": "/etc/containers/policy.json", "mode": 420, "overwrite": true, "contents": {"source": "data:text/plain;charset=utf-8;base64,"}}]}}'
