apiVersion: v1beta1
kind: ImageBasedInstallationConfig
metadata:
  name: image-based-installation-config
{% if rhacm_disconnected_registry and rhacm_disconnected_registry|length > 1 %}
additionalTrustBundle: |
  {{ mirror_cert.content | b64decode | indent(width=2) }}
ImageDigestSources:
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}/{{ 'openshift/release-images' if use_oc_mirror_v2 else 'ocp4/openshift4' }}
  source: quay.io/openshift-release-dev/ocp-release
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}/{{ 'openshift/release' if use_oc_mirror_v2 else 'ocp4/openshift4' }}
  source: quay.io/openshift-release-dev/ocp-v4.0-art-dev
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}/{{ 'openshift/release' if use_oc_mirror_v2 else 'ocp5/openshift5' }}
  source: quay.io/openshift-release-dev/ocp-v5.0-art-dev
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}
  source: quay.io
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}
  source: registry.redhat.io
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}
  source: registry.connect.redhat.com
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}
  source: brew.registry.redhat.io
- mirrors:
  - {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}
  source: registry-proxy.engineering.redhat.com
{% endif %}
seedImage: {{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}/openshift-kni/ocp-ibu:{{ seed_image_tag }}.ibu-x86_64
seedVersion: "{{ seed_image_version }}"
extraPartitionStart: "50G"
{% if ibi_prep_iso_ignitionConfigOverride|length > 2 %}
ignitionConfigOverride: '{{ ibi_prep_iso_ignitionConfigOverride }}'
{% endif %}
installationDisk: "{{ ibi_iso_node_install_disk }}"
sshKey: "{{ lookup('file', ssh_public_key_file) }}"
pullSecret: '{"auths": {"{{ rhacm_disconnected_registry }}:{{ rhacm_disconnected_registry_port }}": {"auth": "{{ (registry_user + ':' + registry_password) | b64encode }}"}}}'
#rhcosLiveIso: "https://mirror.openshift.com/pub/openshift-v4/amd64/dependencies/rhcos/latest/rhcos-live.x86_64.iso"
#precacheBestEffort: true
shutdown: true
networkConfig:
  interfaces:
  - name: {{ ibi_iso_node_nic }}
    identifier: mac-address
    mac-address: {{ ibi_iso_node_mac }}
    type: ethernet
    state: up
{% if ibi_iso_node_ip | ansible.utils.ipv4 %}
    ipv4:
      enabled: true
      address:
      - ip: "{{ ibi_iso_node_ip }}"
        prefix-length: {{ ibi_iso_node_prefix }}
    ipv6:
      enabled: false
{% else %}
    ipv4:
      enabled: false
    ipv6:
      enabled: true
      address:
      - ip: "{{ ibi_iso_node_ip }}"
        prefix-length: {{ ibi_iso_node_prefix }}
{% endif %}
  dns-resolver:
    config:
      server:
      - {{ ibi_iso_node_dns }}
  routes:
    config:
    - destination: {{ "::/0" if ibi_iso_node_ip | ansible.utils.ipv6 else "0.0.0.0/0" }}
      metric: 150
      next-hop-address: {{ ibi_iso_node_gateway }}
      next-hop-interface: {{ ibi_iso_node_nic }}
