---
# ocloud-ztp default vars
# Scaffolding for a new O-Cloud Manager GitOps repo: hardwareprofiles, inventory,
# top-level kustomizations, ArgoCD apps, and ProvisioningRequest directories.
# Per-version ClusterTemplates and PolicyTemplates are handled by ocloud-ztp-templates.

ocloud_manager_namespace: oran-o2ims

hv_vm_manifests_directory: /root/hv-vm

ocloud_inventory_source: "{{ hv_vm_manifests_directory }}/sno/ocloud-inventory"
ocloud_provisioningrequest_source: "{{ hv_vm_manifests_directory }}/sno"

# ocloud ztp will always be using telco-reference repo directories
ztp_repo_name: telco-reference
ztp_argocd_base_path: telco-ran/configuration/argocd

########################################################
# Clustertemplate GitOps directory vars
########################################################
# Hardware profiles vars
ocloud_hardware_profile_name: hw-profile-lab
ocloud_hardware_mgmt_enabled: false
# Inventory vars
# Location -> OCloudSite -> ResourcePool
ocloud_location_name: location-lab
ocloud_location_description: "Lab Location"
ocloud_site_name: site-lab
ocloud_site_description: "Lab Site"
ocloud_resourcepool_name: resourcepool-lab
ocloud_resourcepool_description: "Lab Resource Pool"

########################################################
# Cluster And Policy ArgoCD Application vars
########################################################

# Gogs credentials and service for each cluster and policy application
gogs_username: testadmin
gogs_password: testadmin
gogs_host: "[fc00:1010::1]"
gogs_port: 10880
