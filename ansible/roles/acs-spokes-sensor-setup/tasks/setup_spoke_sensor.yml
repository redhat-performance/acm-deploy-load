---
# Setup ACS sensor on a single managed cluster

- name: Get managed cluster kubeconfig
  shell: |
    oc get secret -n {{ managed_cluster_name }} {{ managed_cluster_name }}-admin-kubeconfig \
      -o jsonpath='{.data.kubeconfig}' | base64 -d
  register: spoke_kubeconfig
  changed_when: false
  failed_when: spoke_kubeconfig.rc != 0

- name: Create temporary kubeconfig file for spoke
  tempfile:
    state: file
    suffix: .kubeconfig
  register: spoke_kubeconfig_file

- name: Write kubeconfig to temporary file
  copy:
    content: "{{ spoke_kubeconfig.stdout }}"
    dest: "{{ spoke_kubeconfig_file.path }}"
    mode: '0600'

- name: Create sensor generation work directory
  file:
    path: "{{ sensor_work_dir }}"
    state: directory
    mode: '0755'

- name: Check if cluster already exists in ACS Central
  shell: |
    roxctl cluster list -e {{ rox_central_address }} {% if roxctl_insecure %}--insecure-skip-tls-verify{% endif %} 2>/dev/null | grep -q "{{ managed_cluster_name }}" && echo "EXISTS" || echo "NOTFOUND"
  environment:
    ROX_API_TOKEN: "{{ rox_api_token }}"
  register: cluster_check
  changed_when: false
  failed_when: false

- name: Delete existing cluster if force_sensor_regeneration is enabled
  shell: |
    roxctl cluster delete {{ managed_cluster_name }} -e {{ rox_central_address }} {% if roxctl_insecure %}--insecure-skip-tls-verify{% endif %} --force 2>/dev/null
  environment:
    ROX_API_TOKEN: "{{ rox_api_token }}"
  register: cluster_delete
  changed_when: false
  failed_when: false
  when: cluster_check.stdout == "EXISTS" and force_sensor_regeneration | bool

- name: Generate sensor for {{ managed_cluster_name }}
  shell: |
    set -e
    cd {{ sensor_work_dir }}
    roxctl sensor generate openshift \
      --name {{ managed_cluster_name }} \
      --central "{{ rox_central_address }}:443" \
      --openshift-version {{ openshift_version }} \
      {% if roxctl_insecure %}--insecure-skip-tls-verify{% endif %} \
      -e {{ rox_central_address }}
  environment:
    ROX_API_TOKEN: "{{ rox_api_token }}"
  register: sensor_generate_result
  changed_when: true
  when: cluster_check.stdout == "NOTFOUND" or force_sensor_regeneration | bool

- name: Display sensor generation output
  debug:
    msg: "{{ sensor_generate_result.stdout }}"
  when: sensor_generate_result.stdout | length > 0

- name: Deploy sensor to {{ managed_cluster_name }}
  shell: |
    set -e
    cd {{ sensor_work_dir }}/{{ managed_cluster_name }}
    ./sensor.sh
  environment:
    KUBECONFIG: "{{ spoke_kubeconfig_file.path }}"
  register: sensor_deploy_result
  changed_when: true
  when: cluster_check.stdout == "NOTFOUND" or force_sensor_regeneration | bool

- name: Display sensor deployment output
  debug:
    msg: "{{ sensor_deploy_result.stdout }}"
  when: sensor_deploy_result.stdout | length > 0

- name: Record sensor setup result
  set_fact:
    sensor_setup_results: "{{ sensor_setup_results + [sensor_result] }}"
  vars:
    sensor_result:
      cluster: "{{ managed_cluster_name }}"
      status: "SUCCESS"
      timestamp: "{{ ansible_date_time.iso8601 }}"

- name: Clean up temporary kubeconfig file
  file:
    path: "{{ spoke_kubeconfig_file.path }}"
    state: absent

- name: Clean up sensor generation directory
  file:
    path: "{{ sensor_work_dir }}/{{ managed_cluster_name }}"
    state: absent
