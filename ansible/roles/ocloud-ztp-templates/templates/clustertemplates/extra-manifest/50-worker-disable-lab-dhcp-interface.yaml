apiVersion: machineconfiguration.openshift.io/v1
kind: MachineConfig
metadata:
  labels:
    machineconfiguration.openshift.io/role: worker
  name: 50-worker-disable-lab-dhcp-interface
spec:
  config:
    ignition:
      version: 3.2.0
    storage:
      files:
        - contents:
            source: "data:text/plain;charset=utf-8;base64,{{ ('[keyfile]\nunmanaged-devices=interface-name:' + ocloud_lab_dhcp_interface + '\n') | b64encode }}"
          filesystem: root
          mode: 420
          path: /etc/NetworkManager/conf.d/99-unmanaged-devices.conf
