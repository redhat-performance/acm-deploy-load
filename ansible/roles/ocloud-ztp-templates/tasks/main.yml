---
# ocloud-ztp-templates tasks
# Templates a version's ClusterTemplates and PolicyTemplates into an existing
# O-Cloud Manager GitOps repo. Generates templates for all configured profiles
# (ocloud_clustertemplate_profiles). Can be run multiple times for different versions.

# Set pull-secret for disconnected registry if configured
- name: Set pull-secret for disconnected registry
  ansible.builtin.set_fact:
    pull_secret: "{{ disconnected_pull_secret }}"
  when:
  - rhacm_disconnected_registry is defined
  - rhacm_disconnected_registry is not none
  - rhacm_disconnected_registry | length > 1

# clustertemplates version-level directories (profile subdirs created in templates-profile.yml)
- name: Create clustertemplates version-level directories for version {{ ocloud_clustertemplate_ocp_version }}
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
  - "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/"
  - "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/extra-manifest/"
  - "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/ibu-manifest/"

- name: Template extra-manifest resources for version {{ ocloud_clustertemplate_ocp_version }}
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
  loop:
  - src: clustertemplates/extra-manifest/marketplace-ns.yaml
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/extra-manifest/marketplace-ns.yaml"
  - src: clustertemplates/extra-manifest/98-var-lib-containers-partitioned.yaml
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/extra-manifest/98-var-lib-containers-partitioned.yaml"
  - src: clustertemplates/extra-manifest/enable-crun-master.yaml
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/extra-manifest/enable-crun-master.yaml"
  - src: clustertemplates/extra-manifest/enable-crun-worker.yaml
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/extra-manifest/enable-crun-worker.yaml"

- name: Copy telco-reference extra-manifest content into version {{ ocloud_clustertemplate_ocp_version }} extra-manifest directory
  ansible.builtin.copy:
    src: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_source_crs_path }}/extra-manifest/"
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/extra-manifest/"
    remote_src: true

- name: Copy IBU manifest PlatformBackupRestore into version {{ ocloud_clustertemplate_ocp_version }} ibu-manifest directory
  ansible.builtin.copy:
    src: ibu-manifest/PlatformBackupRestore.yaml
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/ibu-manifest/PlatformBackupRestore.yaml"

# Per-profile ClusterTemplate and PolicyTemplate generation
- name: Template per-profile resources for version {{ ocloud_clustertemplate_ocp_version }}
  ansible.builtin.include_tasks: templates-profile.yml
  loop: "{{ ocloud_clustertemplate_profiles }}"
  loop_control:
    loop_var: profile

# Version kustomizations use the full profiles list — templated after the loop
- name: Template version kustomization for version {{ ocloud_clustertemplate_ocp_version }} clustertemplates
  ansible.builtin.template:
    src: clustertemplates/version-kustomization.yaml.j2
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/{{ ocloud_clustertemplate_folder }}/kustomization.yaml"

- name: Template version kustomization for version {{ ocloud_clustertemplate_ocp_version }} policytemplates
  ansible.builtin.template:
    src: policytemplates/version-kustomization.yaml.j2
    dest: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/policytemplates/{{ ocloud_clustertemplate_folder }}/kustomization.yaml"

- name: Add version {{ ocloud_clustertemplate_ocp_version }} to clustertemplates kustomization
  ansible.builtin.lineinfile:
    path: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/clustertemplates/kustomization.yaml"
    line: "- {{ ocloud_clustertemplate_folder }}"
    insertafter: "^- "

- name: Add version {{ ocloud_clustertemplate_ocp_version }} to policytemplates kustomization
  ansible.builtin.lineinfile:
    path: "{{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/policytemplates/kustomization.yaml"
    line: "- {{ ocloud_clustertemplate_folder }}"
    insertafter: "^- "

# Commit and push
- name: Commit and push O-Cloud version {{ ocloud_clustertemplate_ocp_version }} to {{ ztp_repo_name }}
  ansible.builtin.shell: |
    cd {{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}
    git add {{ ztp_argocd_base_path }}/
    git commit -a -m "Add O-Cloud Manager version {{ ocloud_clustertemplate_ocp_version }}"
    git push origin-gogs
