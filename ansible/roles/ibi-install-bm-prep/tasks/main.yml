---
# ibi-install-bm-prep tasks
# Only tested with Dell iDRAC type machines, Boots IBI prep iso and waits for completion (Powered off)

- name: Dell - Probe for iDRAC 10+ endpoint
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Managers/iDRAC.Embedded.1"
    force_basic_auth: true
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    method: GET
    validate_certs: false
    headers:
      Accept: "application/json"
    status_code: [200, 404]
    return_content: true
  register: idrac1_check

- name: Dell - Determine iDRAC generation
  ansible.builtin.set_fact:
    idrac10: "{{ idrac1_check.status != 200 or idrac1_check.json.VirtualMedia is not defined }}"

- name: Dell - Set redfish attributes for the detected iDRAC generation
  ansible.builtin.set_fact:
    virtual_media_path: "{{ '/redfish/v1/Systems/System.Embedded.1/VirtualMedia/1' if idrac10 | bool else '/redfish/v1/Managers/iDRAC.Embedded.1/VirtualMedia/CD' }}"
    scp_import_path: >-
      {{ idrac1_check.json.Actions.Oem | default({}, true) | dict2items
         | selectattr('key', 'search', 'ImportSystemConfiguration$')
         | map(attribute='value.target') | first
         | default('/redfish/v1/Managers/iDRAC.Embedded.1/Actions/Oem/EID_674_Manager.ImportSystemConfiguration', true) }}

- name: Dell - Check if machine powered on
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Systems/System.Embedded.1/"
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    method: GET
    headers:
      Accept: application/json
    status_code: [200, 500, 502, 503, 504]
    validate_certs: false
    return_content: true
    timeout: 15
  register: check_power
  retries: 10
  delay: 3
  until:
  - check_power.status == 200
  - check_power.json is defined
  - "'PowerState' in check_power.json"

- name: Dell - Power off
  community.general.redfish_command:
    category: Systems
    command: PowerForceOff
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    timeout: 60
  when: check_power.json.PowerState == "On"
  register: power_off_result
  until: not power_off_result.failed
  retries: 10
  delay: 3

- name: Dell - Wait until machine powered off
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Systems/System.Embedded.1/"
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    method: GET
    headers:
      Accept: application/json
    status_code: [200, 500, 502, 503, 504]
    validate_certs: false
    return_content: true
    timeout: 15
  register: check_power
  when: power_off_result is not skipped
  until:
  - check_power.status == 200
  - check_power.json is defined
  - check_power.json.get('PowerState') == "Off"
  retries: 10
  delay: 3

- name: Dell - Check for virtual media
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}{{ virtual_media_path }}"
    force_basic_auth: true
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    method: GET
    headers:
      Accept: application/json
    validate_certs: false
    status_code: [200, 404, 500, 502, 503, 504]
    return_content: true
    timeout: 15
  register: check_virtual_media
  retries: 10
  delay: 3
  until:
  - check_virtual_media.status == 200
  - check_virtual_media.json is defined
  - check_virtual_media.json is mapping

- name: Dell - Eject any CD virtual media
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}{{ virtual_media_path }}/Actions/VirtualMedia.EjectMedia"
    force_basic_auth: true
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    method: POST
    headers:
      content-type: application/json
      Accept: application/json
    body: {}
    body_format: json
    validate_certs: false
    status_code: 204
    return_content: true
  when: check_virtual_media.json.Image | default(none) is not none

- name: Dell - Insert virtual media
  community.general.redfish_command:
    category: "{{ 'Systems' if idrac10 | bool else 'Manager' }}"
    command: VirtualMediaInsert
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    virtual_media:
      image_url: "http://{{ http_store_host }}:{{ http_store_port }}/ibi/{{ ibi_iso_name }}.iso"
      media_types:
      - CD
      - DVD
    resource_id: "{{ 'System.Embedded.1' if idrac10 | bool else 'iDRAC.Embedded.1' }}"
    timeout: 60
  register: insert_result
  until: not insert_result.failed
  retries: 10
  delay: 3

- name: Dell - Set OneTimeBoot VirtualCD
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}{{ scp_import_path }}"
    force_basic_auth: true
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    method: POST
    headers:
      content-type: application/json
      Accept: application/json
    body:
      ShareParameters:
        Target: "{{ ['ALL'] if idrac10 | bool else 'ALL' }}"
      ImportBuffer: '<SystemConfiguration><Component FQDD="iDRAC.Embedded.1"><Attribute Name="ServerBoot.1#BootOnce">Enabled</Attribute><Attribute Name="ServerBoot.1#FirstBootDevice">VCD-DVD</Attribute></Component></SystemConfiguration>'
    body_format: json
    validate_certs: false
    status_code: 202
    return_content: true
  register: onetimeboot_result
  until: not onetimeboot_result.failed
  retries: 10
  delay: 3

- name: Dell - Power on
  community.general.redfish_command:
    category: Systems
    command: PowerOn
    baseuri: "{{ bmc_address }}"
    username: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    timeout: 60
  register: power_on_result
  until: not power_on_result.failed
  retries: 10
  delay: 3

- name: Dell - Wait until machine powered on
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Systems/System.Embedded.1/"
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    method: GET
    headers:
      Accept: application/json
    status_code: [200, 500, 502, 503, 504]
    validate_certs: false
    return_content: true
    timeout: 15
  register: check_power
  until:
  - check_power.status == 200
  - check_power.json is defined
  - check_power.json.get('PowerState') == "On"
  retries: 10
  delay: 3

- name: Dell - Wait until machine powered off (IBI prep complete)
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}/redfish/v1/Systems/System.Embedded.1/"
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    method: GET
    headers:
      Accept: application/json
    status_code: [200, 500, 502, 503, 504]
    validate_certs: false
    return_content: true
    timeout: 15
  register: check_complete
  until:
  - check_complete.status == 200
  - check_complete.json is defined
  - check_complete.json.get('PowerState') == "Off"
  retries: 360
  delay: 10

- name: Dell - Eject virtual media
  ansible.builtin.uri:
    url: "https://{{ bmc_address }}{{ virtual_media_path }}/Actions/VirtualMedia.EjectMedia"
    user: "{{ bmc_user }}"
    password: "{{ bmc_password }}"
    force_basic_auth: true
    method: POST
    headers:
      content-type: application/json
      Accept: application/json
    body: {}
    body_format: json
    status_code: [204]
    validate_certs: false
    return_content: true
