---
# ibu-prepare-seed-cluster-unmanage tasks

- name: Create directories for IBU seed cluster to detach cluster
  file:
    path: "{{ item }}"
    state: directory
  loop:
  - "{{ install_directory }}/rhacm-ztp"
  - "{{ install_directory }}/rhacm-ztp/ibu"
  - "{{ install_directory }}/rhacm-ztp/ibu/seed"

- name: Select cluster to use as seed cluster
  shell: |
    KUBECONFIG={{ hub_cluster_kubeconfig }} oc get managedclusters -l ztp-done=,common=true --no-headers -o custom-columns=NAME:'.metadata.name' | head -n 1
  register: select_cluster
  when: seed_cluster == ""

- name: Set seed_cluster when not previously set
  set_fact:
    seed_cluster: "{{ select_cluster.stdout }}"
  when: seed_cluster == ""

- name: Display selected seed_cluster
  debug:
    msg: "{{ seed_cluster }}"

- name: Set seed cluster kubeconfig
  set_fact:
    seedcluster_kubeconfig: "{{ install_directory }}/rhacm-ztp/ibu/seed/{{ seed_cluster }}.kubeconfig"

- name: Copy {{ seed_cluster }} kubeconfig
  copy:
    src: "/root/hv-vm/kc/{{ seed_cluster }}/kubeconfig"
    dest: "{{ seedcluster_kubeconfig }}"
    remote_src: true

# Detect whether this cluster was provisioned via O-Cloud ProvisioningRequest
- name: Find ProvisioningRequest for {{ seed_cluster }}
  shell: |
    set -o pipefail
    KUBECONFIG={{ hub_cluster_kubeconfig }} oc get provisioningrequests.clcm.openshift.io \
      -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.spec.templateParameters.clusterInstanceParameters.clusterName}{"\n"}{end}' | \
      awk -v cluster="{{ seed_cluster }}" '$2 == cluster {print $1}'
  register: seed_cluster_pr
  changed_when: false
  failed_when:
  - seed_cluster_pr.rc != 0
  - '"the server doesn''t have a resource type" not in seed_cluster_pr.stderr'

- name: Set ocloud detection facts
  set_fact:
    seed_cluster_is_ocloud: "{{ seed_cluster_pr.stdout | length > 0 }}"
    seed_cluster_pr_name: "{{ seed_cluster_pr.stdout | trim }}"

- name: Display ocloud detection result
  debug:
    msg: >-
      {{ seed_cluster }} is {{ 'an O-Cloud cluster (PR: ' + seed_cluster_pr_name + ')' if seed_cluster_is_ocloud else 'a GitOps cluster' }}

# O-Cloud unmanage path: annotate to skip cleanup then delete the ProvisioningRequest
- name: OCloud - Unmanage {{ seed_cluster }}
  when: seed_cluster_is_ocloud
  block:
  - name: OCloud - Annotate ProvisioningRequest {{ seed_cluster_pr_name }} to skip cleanup
    shell: |
      KUBECONFIG={{ hub_cluster_kubeconfig }} oc annotate provisioningrequests.clcm.openshift.io {{ seed_cluster_pr_name }} clcm.openshift.io/skip-cleanup=""

  - name: OCloud - Delete ProvisioningRequest {{ seed_cluster_pr_name }}
    shell: |
      KUBECONFIG={{ hub_cluster_kubeconfig }} oc delete provisioningrequests.clcm.openshift.io {{ seed_cluster_pr_name }}

# GitOps unmanage path: comment out the cluster in kustomization and push
- name: GitOps - Unmanage {{ seed_cluster }}
  when: not seed_cluster_is_ocloud
  block:
  - name: GitOps - Get cluster application containing {{ seed_cluster }}
    shell: |
      grep -l "{{ seed_cluster }}" /root/rhacm-ztp/{{ ztp_repo_name }}/{{ ztp_argocd_base_path }}/cluster/ztp-clusters-*/kustomization.yaml
    register: seed_cluster_kustomization

  - name: GitOps - Set cluster application fact
    set_fact:
      seed_cluster_application: "{{ seed_cluster_kustomization.stdout.split('/')[-2] }}"

  - name: GitOps - Comment {{ seed_cluster }} out of kustomization {{ seed_cluster_kustomization.stdout }}
    replace:
      path: "{{ seed_cluster_kustomization.stdout }}"
      replace: "{{ item.replace }}"
      regexp: "{{ item.regexp }}"
    loop:
    - replace: '#\1'
      regexp: "^(?!#)(- (\\./)?{{ seed_cluster }}-siteconfig\\.ya?ml.*)$"
    - replace: '#\1'
      regexp: "^(?!#)(- (\\./)?{{ seed_cluster }}-resources\\.ya?ml.*)$"
    - replace: '#\1'
      regexp: "^(?!#)(- (\\./)?{{ seed_cluster }}-clusterinstance\\.ya?ml.*)$"

  - name: GitOps - Commit and push changes to {{ ztp_repo_name }}
    shell: |
      cd {{ install_directory }}/rhacm-ztp/{{ ztp_repo_name }}
      git add {{ ztp_argocd_base_path }}/cluster/ {{ ztp_argocd_base_path }}/cluster-applications/
      git commit -a -m "Remove seed cluster {{ seed_cluster }} from cluster application - {{ seed_cluster_application }}"
      git push origin-gogs

  - name: GitOps - Trigger ArgoCD refresh for {{ seed_cluster_application }}
    shell: |
      KUBECONFIG={{ hub_cluster_kubeconfig }} oc annotate applications.argoproj.io -n openshift-gitops {{ seed_cluster_application }} argocd.argoproj.io/refresh=normal

# ignore_errors because we want the namespace to not exist
- name: Wait until cluster is no longer managed
  shell: |
    KUBECONFIG={{ hub_cluster_kubeconfig }} oc get ns {{ seed_cluster }}
  register: check_cluster_namespace
  ignore_errors: true
  until: check_cluster_namespace.rc != 0
  retries: 180
  delay: 5
